name: Publish to ComfyUI Registry

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Publish to Comfy Registry
        env:
          COMFY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: uvx --from comfy-cli comfy --skip-prompt --no-enable-telemetry node publish --token "$COMFY_TOKEN"
